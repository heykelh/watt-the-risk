<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WATT THE RISK?!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
/* VOICE: arcade NES, malicieux mais expert, le métier du costing énergie raconté en jeu
   IDEA: une borne d'arcade qui transforme une fiche de chiffrage en partie à roues
   PICTURE: skyline pixel de nuit, éoliennes, courbe de prix néon, roues à ampoules
   COLOUR and TYPE: palette de saison qui change à chaque dossier; Press Start 2P + VT323
   LAYOUT: écran titre plein cadre, puis une colonne de cartes de jeu, roues en rangée */
@property --bg{syntax:'<color>';inherits:true;initial-value:#0b1030}
@property --a1{syntax:'<color>';inherits:true;initial-value:#39d0ff}
@property --a2{syntax:'<color>';inherits:true;initial-value:#ff3fa4}
@property --a3{syntax:'<color>';inherits:true;initial-value:#ffd23f}
:root{color-scheme:dark;--bg:#0b1030;--a1:#39d0ff;--a2:#ff3fa4;--a3:#ffd23f;--ink:#f4f1ff;--mut:#b9b4d6;--card:rgba(10,8,30,.72);--ok:#7cff6b;--ko:#ff4d6d;
transition:--bg 1.2s,--a1 1.2s,--a2 1.2s,--a3 1.2s}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--bg);color:var(--ink);overflow-x:clip}
body{font:22px/1.25 'VT323',monospace;min-height:100vh;background:radial-gradient(ellipse at 50% -10%,color-mix(in srgb,var(--a1) 30%,transparent),transparent 60%),radial-gradient(ellipse at 100% 100%,color-mix(in srgb,var(--a2) 22%,transparent),transparent 55%),var(--bg)}
.px{font-family:'Press Start 2P',monospace;letter-spacing:0}
button{font:12px/1.3 'Press Start 2P',monospace;color:#120c22;background:var(--a3);border:0;padding:14px 18px;min-height:44px;cursor:pointer;box-shadow:0 4px 0 color-mix(in srgb,var(--a3) 45%,#000),0 0 0 3px #120c22;transition:transform .08s}
button:hover{filter:brightness(1.12)}button:active{transform:translateY(3px);box-shadow:0 1px 0 #000,0 0 0 3px #120c22}
button:focus-visible,input:focus-visible{outline:3px solid var(--a1);outline-offset:3px}
button.alt{background:var(--a1);box-shadow:0 4px 0 color-mix(in srgb,var(--a1) 45%,#000),0 0 0 3px #120c22}
button.ghost{background:transparent;color:var(--ink);box-shadow:0 0 0 3px var(--mut)}
button:disabled{opacity:.45;cursor:not-allowed}
.crt{pointer-events:none;position:fixed;inset:0;z-index:50;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}
.vig{pointer-events:none;position:fixed;inset:0;z-index:49;box-shadow:inset 0 0 160px rgba(0,0,0,.7)}
.screen{display:none}.screen.on{display:block;animation:fade .5s}
@keyframes fade{from{opacity:0;transform:scale(.985)}to{opacity:1}}
/* TITLE */
#title{position:relative;min-height:100vh;overflow:hidden}
#tc{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;object-fit:cover;object-position:50% 100%}
.tbox{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:18px;padding:9vh 16px 120px;text-align:center}
.logo{font-family:'Press Start 2P';font-size:clamp(28px,7.4vw,84px);line-height:1.1;margin:0;filter:drop-shadow(0 6px 0 #120c22) drop-shadow(0 0 22px rgba(255,255,255,.25))}
.logo span{display:inline-block;animation:wave 1.6s ease-in-out infinite,hue 6s linear infinite}
@keyframes wave{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes hue{0%{color:#39d0ff}20%{color:#ff3fa4}40%{color:#ffd23f}60%{color:#7cff6b}80%{color:#ff7a1e}100%{color:#39d0ff}}
.sub{font-family:'Press Start 2P';font-size:clamp(10px,1.6vw,15px);color:#fff;background:#120c22cc;padding:10px 14px;box-shadow:0 0 0 3px var(--a2)}
.blink{animation:blk 1s steps(2) infinite;font-family:'Press Start 2P';font-size:13px;color:var(--a3)}
@keyframes blk{50%{opacity:0}}
.tbtns{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;margin-top:8px}
#start{font-size:18px;padding:18px 28px}
.ticker{position:absolute;bottom:0;left:0;right:0;z-index:3;background:#120c22;border-top:3px solid var(--a1);overflow:hidden;white-space:nowrap;height:44px;display:flex;align-items:center}
.ticker div{display:inline-block;padding-left:100%;animation:tick 60s linear infinite;color:var(--a3)}
@keyframes tick{to{transform:translateX(-100%)}}
.lang{position:absolute;top:14px;right:14px;z-index:4}
.credit{position:absolute;bottom:54px;left:0;right:0;z-index:3;text-align:center;font-size:18px;color:#ddd;text-shadow:0 2px 0 #000}
/* GAME */
.wrap{max-width:1180px;margin:0 auto;padding:18px max(3vw,12px) 60px}
.hud{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;background:#120c22e6;box-shadow:0 0 0 3px var(--a1);padding:12px 14px;position:sticky;top:8px;z-index:20}
.hud .px{font-size:11px}.hud b{color:var(--a3)}
.tools{display:flex;gap:6px}.tool{font:9px 'Press Start 2P';padding:6px 7px;background:#ffffff14;color:var(--mut)}.tool.on{background:var(--a1);color:#120c22}
.card{background:var(--card);box-shadow:0 0 0 3px color-mix(in srgb,var(--a2) 70%,#000),8px 8px 0 #0008;padding:18px;margin-top:22px;backdrop-filter:blur(3px)}
.card h2{font:15px/1.4 'Press Start 2P';margin:0 0 12px;color:var(--a1)}
.card h3{font:11px/1.4 'Press Start 2P';margin:14px 0 8px;color:var(--a3)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px}
@media(max-width:820px){.grid2{grid-template-columns:minmax(0,1fr)}}
.brief{display:grid;grid-template-columns:120px minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:560px){.brief{grid-template-columns:minmax(0,1fr)}}
.npc{width:120px;height:120px;image-rendering:pixelated;background:#ffffff10;box-shadow:0 0 0 3px var(--a3)}
.quote{background:#fff;color:#120c22;padding:10px 12px;position:relative;margin-top:8px}
.tag{display:inline-block;font:9px 'Press Start 2P';padding:6px 8px;margin:0 6px 6px 0;background:#ffffff1c;color:var(--ink)}
.season{font:10px 'Press Start 2P';color:#120c22;background:var(--a3);padding:5px 8px}
.ctl{margin:14px 0}.ctl label{display:flex;justify-content:space-between;gap:10px}.ctl label b{color:var(--a3)}
input[type=range]{width:100%;height:44px;accent-color:var(--a2);background:transparent}
.hint{color:var(--mut);font-size:19px}
.stack{display:flex;height:34px;box-shadow:0 0 0 3px #120c22;margin:10px 0}
.stack i{display:block;height:100%;transition:width .3s}
.leg{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;font-size:20px}
.leg span:nth-child(even){text-align:right;white-space:nowrap}
.dot{display:inline-block;width:12px;height:12px;margin-right:8px;vertical-align:middle}
.price{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px;margin-top:10px}
.big{font:clamp(22px,3.4vw,34px) 'Press Start 2P';color:var(--a3);text-shadow:3px 3px 0 #120c22}
.gauge{height:22px;background:#ffffff18;box-shadow:0 0 0 3px #120c22;margin-top:6px}.gauge i{display:block;height:100%;transition:width .3s,background .3s}
.risk{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:8px}
.risk div{background:#ffffff10;padding:8px;text-align:center}.risk b{display:block;font:12px 'Press Start 2P';color:var(--a1);margin-top:4px;white-space:nowrap}
@media(max-width:520px){.risk{grid-template-columns:repeat(2,minmax(0,1fr))}}
.locked{color:var(--mut);border:2px dashed #ffffff40;padding:10px}
.wheels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
@media(max-width:900px){.wheels{grid-template-columns:minmax(0,1fr)}}
.wheel{display:flex;flex-direction:column;align-items:center}
.wheel h3{text-align:center}
.wheel{position:relative;padding:14px 8px 10px;background:radial-gradient(circle at 50% 42%,color-mix(in srgb,var(--a1) 22%,transparent),transparent 62%),radial-gradient(ellipse at 50% 100%,#0b3a24 0,#06170f 70%);box-shadow:inset 0 0 0 3px #b8860b,inset 0 0 0 6px #120c22,inset 0 0 40px #000}
.wheel canvas{width:min(310px,82vw);height:min(310px,82vw)}
.wheel h3{background:linear-gradient(90deg,#7a5512,#ffe58a,#b8860b);color:#2a1a00!important;padding:6px 10px;margin:0 0 6px!important}
.wl div.bonus{background:linear-gradient(90deg,#ffd70033,transparent)}.wl div.malus{background:linear-gradient(90deg,#ff2a4a33,transparent)}.wl div.malus .dot{box-shadow:0 0 0 2px #ff2a4a}.wl div.bonus .dot{box-shadow:0 0 6px #ffd700}
.wl div.hit{background:var(--a3)!important;color:#120c22}
.shake{animation:shk .5s}@keyframes shk{20%{transform:translateX(-8px) rotate(-1deg)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.glow{animation:glw 1.2s}@keyframes glw{30%{box-shadow:inset 0 0 0 3px #ffd700,0 0 40px #ffd700}}
.wl{width:100%;font-size:19px;margin-top:8px}
.wl div{display:grid;grid-template-columns:16px minmax(0,1fr) auto;gap:6px;align-items:center;padding:2px 4px}
.wl div.hit{background:var(--a3);color:#120c22}
.wl small{font-size:17px;opacity:.85}
.stamp{font:clamp(22px,5vw,44px) 'Press Start 2P';text-align:center;padding:18px;margin:8px 0;animation:stamp .5s cubic-bezier(.2,2,.4,1)}
@keyframes stamp{from{transform:scale(3) rotate(-12deg);opacity:0}}
.ok{color:var(--ok)}.ko{color:var(--ko)}
table{width:100%;border-collapse:collapse;font-size:20px}td,th{padding:6px 8px;border-bottom:1px solid #ffffff22;text-align:left}td:last-child,th:last-child{text-align:right;white-space:nowrap}
.fact{background:color-mix(in srgb,var(--a1) 18%,#120c22);box-shadow:0 0 0 3px var(--a1);padding:14px;margin-top:16px}
.fact .px{font-size:10px;color:var(--a1);display:block;margin-bottom:8px}
.qopts{display:grid;gap:10px;margin-top:10px}.qopts button{text-align:left;font-size:11px;line-height:1.5;background:#ffffff18;color:var(--ink);box-shadow:0 0 0 2px #ffffff40}
.qopts button.good{background:var(--ok);color:#120c22}.qopts button.bad{background:var(--ko);color:#120c22}
.row{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-top:16px}
/* MODALS */
.modal{position:fixed;inset:0;z-index:40;background:#05031099;display:none;align-items:center;justify-content:center;padding:14px}
.modal.on{display:flex;animation:fade .3s}
.mbox{background:#140f2b;box-shadow:0 0 0 4px var(--a2),10px 10px 0 #000;max-width:860px;width:100%;max-height:88vh;overflow:auto;padding:20px}
.mbox h2{font:15px/1.4 'Press Start 2P';color:var(--a3);margin:0 0 14px}
.mclose{float:right;font-size:10px;padding:10px 12px}
.gl{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;margin-top:12px}
.gl div{background:#ffffff0e;padding:10px 12px}.gl b{font:10px/1.6 'Press Start 2P';color:var(--a1)}
#gq{width:100%;font:20px 'VT323';padding:10px;background:#0c0820;color:var(--ink);border:3px solid var(--a1);min-height:44px}
.upg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:12px}
.upg button{display:block;text-align:left;font-size:10px;line-height:1.6;padding:16px;background:#ffffff14;color:var(--ink);box-shadow:0 0 0 3px var(--a1)}
.upg button span{display:block;font:19px/1.2 'VT323';color:var(--mut);margin-top:8px}
.banner{position:fixed;inset:0;z-index:45;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:var(--bg);text-align:center;padding:16px}
.banner.on{display:flex}
.banner .px:first-child{font-size:clamp(28px,7vw,70px);color:var(--a3);animation:slide .9s cubic-bezier(.2,1.4,.4,1)}
.banner .px+.px{font-size:clamp(11px,2vw,16px);color:var(--a1)}
@keyframes slide{from{transform:translateX(-120vw)}}
.fig{position:relative;min-height:300px;margin-top:10px}.fig>svg{position:absolute;inset:0;width:100%;height:100%}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.kpis div{background:#ffffff10;padding:12px;text-align:center}.kpis b{display:block;font:clamp(13px,2vw,18px) 'Press Start 2P';color:var(--a3);margin-top:6px}
@media(max-width:620px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.rank{font:clamp(16px,3vw,26px)/1.4 'Press Start 2P';color:var(--a1);text-align:center;margin:18px 0 6px}
.src{font-size:18px;color:var(--mut)}.src a{color:var(--a1)}
.qs{margin:10px 0;padding-left:22px}.qs li{margin:8px 0}.qs li::marker{content:'? ';color:var(--a3);font-family:'Press Start 2P';font-size:12px}
details.how{margin-top:10px;background:#ffffff0c;padding:10px 12px}details.how summary{font:11px/1.6 'Press Start 2P';color:var(--a1);cursor:pointer;min-height:32px}
.step{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;margin-top:12px}.step b{font:16px 'Press Start 2P';color:#120c22;background:var(--a3);display:flex;align-items:center;justify-content:center;height:44px}
.fml{font-family:'Press Start 2P';font-size:10px;line-height:1.8;background:#120c22;padding:8px 10px;color:var(--a3);display:inline-block;margin:4px 0}
.fig.mini{min-height:150px}
.dash{display:grid;gap:8px}.dash div{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;background:#ffffff0e;padding:8px 10px;align-items:center}
.dash b{white-space:nowrap;color:var(--a1)}.dash small{grid-column:1/-1;color:var(--mut);font-size:18px}
.why{background:#ffffff0e;padding:12px;margin-top:12px}
.stage{min-height:calc(100svh - 110px);display:flex;flex-direction:column;justify-content:center;align-items:center;padding:10px 0 30px}
.stage.anim .panel{animation:pin .45s cubic-bezier(.2,1.2,.4,1)}@keyframes pin{from{opacity:0;transform:translateY(24px) scale(.98)}}
.panel{width:min(760px,100%);margin-top:0}
.panel>p{margin:10px 0}
.nav{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;margin-top:22px}.nav.center{justify-content:center}
.minis{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
button.sm{font-size:9px;padding:10px 12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-top:12px}
.tile{background:#ffffff10;padding:12px;box-shadow:inset 0 0 0 2px #ffffff18}.tile span{display:block;color:var(--mut);font-size:19px}.tile b{display:block;font:13px/1.5 'Press Start 2P';color:var(--a3);margin-top:6px}
.dots{display:flex;gap:4px}.dots i{width:9px;height:9px;background:#ffffff2a}.dots i.done{background:var(--a1)}.dots i.on{background:var(--a3);box-shadow:0 0 8px var(--a3)}
.evcard{background:color-mix(in srgb,var(--a1) 16%,#120c22);box-shadow:0 0 0 3px var(--a1);padding:14px;margin-top:14px}.evcard.alt{background:color-mix(in srgb,var(--a2) 16%,#120c22);box-shadow:0 0 0 3px var(--a2)}
.evcard .px{display:block;font-size:12px;color:var(--a3);margin-bottom:8px}
.lineup{padding-left:28px;margin:8px 0}.lineup li{margin:6px 0}
.flash{text-align:center;padding:10px}.flash .px{display:inline-block;font-size:11px;background:var(--ko);color:#fff;padding:8px 10px;animation:blk 1s steps(2) 3}.flash h2{font-size:clamp(14px,3vw,22px)!important;margin:18px 0!important;color:var(--a3)!important}
.evnote{color:var(--a3);border-left:4px solid var(--a3);padding-left:10px}
.bigwheel{margin:12px auto 0;width:100%;max-width:480px}
.bigwheel canvas{width:min(420px,84vw);height:min(420px,84vw)}
.landcard{margin:16px auto 0;max-width:520px;text-align:center;padding:14px;background:#120c22;box-shadow:0 0 0 3px var(--a1);animation:stamp .45s cubic-bezier(.2,2,.4,1)}
.landcard .px{display:block;font-size:14px;color:var(--a1);margin-bottom:8px}.landcard b{display:block;font-size:22px}.landcard small{display:block;color:var(--mut);font-size:19px;margin-top:4px}
.landcard.bonus{box-shadow:0 0 0 3px #ffd700,0 0 30px #ffd70088}.landcard.bonus .px{color:#ffd700}.landcard.malus{box-shadow:0 0 0 3px #ff2a4a,0 0 30px #ff2a4a88}.landcard.malus .px{color:#ff2a4a}
.verdict{font-size:23px}
#mInfo .wl div{grid-template-columns:16px minmax(0,1fr) auto}
.ctl label b{white-space:nowrap}
@media(max-width:600px){
 body{font-size:20px}
 .lang{top:10px;right:10px;font-size:10px;padding:10px}
 .tbox{padding:12vh 12px 130px;gap:14px}
 .tbtns{flex-direction:column;align-items:stretch;width:min(320px,100%)}
 #start{font-size:20px;padding:20px}
 .credit{font-size:16px;padding:0 10px}
 .wrap{padding:10px 10px 40px}
 .hud{position:sticky;top:0;padding:8px 10px;gap:6px 10px;box-shadow:0 0 0 2px var(--a1)}
 .hud .tools{display:none}
 .hud .row{flex-wrap:nowrap;margin-left:auto}.hud .row button{min-height:36px;padding:8px!important;font-size:8px!important}
 .logo{font-size:clamp(34px,10vw,52px)}
 .card{padding:14px 12px;margin-top:16px;box-shadow:0 0 0 2px color-mix(in srgb,var(--a2) 70%,#000),4px 4px 0 #0008}
 .card h2{font-size:12px}
 .brief{grid-template-columns:72px minmax(0,1fr);gap:12px}.npc{width:72px;height:72px}
 .quote{font-size:19px}
 .dash div{grid-template-columns:minmax(0,1fr)}.dash b{justify-self:start;font-size:22px}
 .leg{font-size:18px}
 .wheels{gap:8px}
 .wheel canvas{width:min(270px,76vw);height:min(270px,76vw)}
 .wl{font-size:17px}.wl small{font-size:15px}
 table{font-size:17px}td,th{padding:5px 4px}td:last-child,th:last-child{white-space:normal}
 .why p{font-size:18px}.fml{font-size:8px}
 .qopts button{font-size:10px;padding:12px}
 .row button{flex:1 1 100%}
 .kpis b{font-size:13px}
 .mbox{padding:14px;max-height:92vh}
 .stamp{padding:10px}
}
@media(max-width:600px){.fig.mini{min-height:110px}.panel>p{margin:6px 0}.bigwheel canvas{width:min(360px,88vw);height:min(360px,88vw)}.stage{min-height:calc(100svh - 90px)}.tile b{font-size:11px}.hud .dots{order:5;width:100%}.verdict{font-size:20px}}
@media(prefers-reduced-motion:reduce){.logo span,.ticker div,.blink{animation:none}}
</style>
</head>
<body>
<div class="crt"></div><div class="vig"></div>

<section id="title" class="screen on">
  <canvas id="tc" width="320" height="180"></canvas>
  <button class="ghost lang" id="langBtn">EN</button>
  <div class="tbox">
    <h1 class="logo" id="logo" aria-label="WATT THE RISK?!"></h1>
    <div class="sub" data-fr="Le jeu du costing énergie : chiffre, couvre, backteste" data-en="The energy costing game: price it, hedge it, backtest it"></div>
    <div class="blink" data-fr="INSÈRE UN KILOWATT" data-en="INSERT ONE KILOWATT"></div>
    <div class="tbtns">
      <button id="start">START</button>
      <button class="alt" id="howBtn" data-fr="COMMENT JOUER" data-en="HOW TO PLAY"></button>
      <button class="alt" id="glossBtn" data-fr="GLOSSAIRE" data-en="GLOSSARY"></button>
    </div>
  </div>
  <div class="credit" data-fr="Un jeu de Heykel Hachiche · projet indépendant, non affilié à EDF" data-en="A game by Heykel Hachiche · independent project, not affiliated with EDF"></div>
  <div class="ticker"><div id="tickTxt"></div></div>
</section>

<section id="game" class="screen">
  <div class="wrap">
    <div class="hud">
      <span class="px"><span data-fr="DOSSIER" data-en="DEAL"></span> <b id="hR">1/6</b></span>
      <span class="season" id="hS"></span>
      <span class="px">P&amp;L <b id="hP">0 k€</b></span>
      <span class="dots" id="dots"></span>
      <span class="tools" id="hT"></span>
      <span class="row hbtn" style="margin:0;gap:8px">
        <button class="ghost" id="g2" style="font-size:9px;padding:8px 10px" data-fr="GLOSSAIRE" data-en="GLOSSARY"></button>
        <button class="ghost" id="snd" style="font-size:9px;padding:8px 10px">SON ON</button>
      </span>
    </div>
    <div class="stage" id="stage"></div>
  </div>
</section>

<section id="report" class="screen">
  <div class="wrap">
    <div class="card">
      <h2 data-fr="RAPPORT ANNUEL DE BACKTESTING" data-en="ANNUAL BACKTESTING REPORT"></h2>
      <div class="kpis" id="kpis"></div>

const sig=(r,price,base)=>{const C=base+r.comp;return .92/(1+Math.exp((price-C)/r.sc))};
const costs=(r,h,mk)=>{const Fp=(r.en==='gaz'?S.yr.Fg:S.yr.F)*r.fwd*r.prof,pr=PRIME*h;const base=Fp+pr+r.cap+r.go+COMM+(r.extra||0);const comp=Fp+PRIME*.6+r.cap+r.go+COMM;return{Fp,pr,base,price:base+mk,p:sig(r,base+mk,comp),C:comp+r.comp}};

const outcome=(r,h,mk,ws,ms,cs)=>{const c=costs(r,h,mk);const ce=cs.v*r.cS*(cs.k==='ev'?r.ev:cs.k==='sol'?r.sol:1);

 const o=S.cur.o,mk=S.cur.mk,Fp=costs(R0,S.cur.h,mk).Fp;
 const verdict=o.ok?(o.over?tl('Couvert avec de la marge : ta provision dépasse nettement le risque de cette année. Sur la durée, un mark-up trop large fait perdre des clients.','Covered with room to spare: your provision clearly exceeds this year\'s risk. Over time, too wide a mark-up loses clients.'):tl('Bien calibré : le mark-up a absorbé le risque réalisé.','Well calibrated: the mark-up absorbed the realised risk.')):tl('Sous-provisionné : le risque réalisé a dépassé ta provision.','Under-provisioned: realised risk exceeded your provision.');
 put('result','<h2>'+tl('BACKTESTING DU DOSSIER','DEAL BACKTEST')+'</h2><p class="verdict '+(o.ok?'ok':'ko')+'">'+verdict+'</p><div class="tiles">'+tile('Volume',fmt(R0.vol,0)+' → '+fmt(o.V,0)+' GWh')+tile(tl('Prix spot','Spot price'),fmt(Fp,1)+' → '+fmt(o.Sp,1)+' €/MWh')+tile(tl('Mark-up / risque réalisé','Mark-up / realised risk'),fmt(mk,2)+' / <span class="'+(o.ok?'ok':'ko')+'">'+fmt(o.risk,2)+'</span>')+tile(S.cur.signed?tl('Marge du dossier','Deal margin'):tl('Marge simulée','Simulated margin'),'<span class="'+(o.margin>=0?'ok':'ko')+'">'+keur(o.margin)+'</span>')+'</div>'+nav(tl('POURQUOI ?','WHY?'),tl('SUITE','NEXT'),'alt'));
 $('bk').onclick=stWhy;$('nx').onclick=stQuiz};
const stWhy=()=>{S.rd=stWhy;put('why','<h2>'+tl('POURQUOI CE RÉSULTAT ?','WHY THIS RESULT?')+'</h2>'+whyT(r(),S.cur.o)+nav(tl('RETOUR','BACK'),tl('SUITE','NEXT')));$('bk').onclick=stResult;$('nx').onclick=stQuiz};
const stQuiz=()=>{S.rd=stQuiz;const F0=FACT[S.fq[S.r%S.fq.length]],Q=QZ[S.qq[S.r%S.qq.length]];
 put('quiz','<div class="fact" style="margin-top:0"><span class="px">'+tl('DONNÉE RÉELLE','REAL DATA')+'</span>'+t(F0)+'</div><h3>'+tl('QUESTION DU MANAGER','MANAGER\'S QUESTION')+'</h3><p>'+t(Q.q)+'</p><div class="qopts">'+Q.o.map((x,i)=>'<button data-i="'+i+'">'+t(x)+'</button>').join('')+'</div><p class="hint" id="qx"></p>'+nav('',S.r===5?tl('RAPPORT ANNUEL','ANNUAL REPORT'):tl('DOSSIER SUIVANT','NEXT DEAL')));
 const bs=[...document.querySelectorAll('.qopts button')];
 const mark=i=>{bs.forEach(x=>{x.disabled=true;if(+x.dataset.i===Q.a)x.classList.add('good')});if(i!==Q.a)bs[i].classList.add('bad');$('qx').textContent=t(Q.x);$('nx').disabled=false};
 if(S.cur.qa!=null)mark(S.cur.qa);else $('nx').disabled=true;
 bs.forEach(b=>b.onclick=()=>{const i=+b.dataset.i;S.cur.qa=i;if(i===Q.a){S.quiz++;beep(988,.15,'triangle')}else beep(160,.2);mark(i)});
 $('nx').onclick=afterRound};
const afterRound=()=>{if(S.r===5){report();return}const left=TOOLS.filter(x=>!S.tools.has(x.id));
 if(left.length){$('upg').innerHTML=left.map(x=>'<button data-id="'+x.id+'">'+t(x.n).toUpperCase()+'<span>'+t(x.d)+'</span></button>').join('');$('mUp').classList.add('on');
  $('upg').querySelectorAll('button').forEach(b=>b.onclick=()=>{S.tools.add(b.dataset.id);$('mUp').classList.remove('on');jingle([784,988,1175]);nextRound()})}
 else nextRound()};
const nextRound=()=>{S.r++;S.h=.6;S.mk=4;S.cur=null;setPal(S.r);const R0=r();let ev=null;
 if(Math.random()<.75&&S.evs.length){const k=S.evs.pop();ev=EVT[k];ev.a(R0);R0.evt=k}
 banner(t(R0.sea),tl('DOSSIER ','DEAL ')+(S.r+1)+' : '+t(R0.name).toUpperCase(),()=>ev?stEvent(ev):stBrief())};

$('start').onclick=()=>{beep(660,.1);newGame();show('game');setPal(0);stYear()};

/* ---------- REPORT ---------- */
const report=()=>{show('report');setPal(0);const H=S.hist,sg=H.filter(h=>h.signed),cal=H.filter(h=>h.ok&&h.mk-h.risk<=5).length;
 let pts=(S.pl>0?2:0)+(sg.length>=3?1:0)+(cal>=4?2:cal>=2?1:0)+(S.quiz>=5?1:0);
 const RK=[[{fr:'STAGIAIRE DU FICHIER EXCEL',en:'EXCEL FILE INTERN'},{fr:'Le tableur a gagné cette année. Relis le glossaire et retente ta chance.',en:'The spreadsheet won this year. Read the glossary and try again.'}],
  [{fr:'ANALYSTE JUNIOR PROMETTEUR',en:'PROMISING JUNIOR ANALYST'},{fr:'Les bases sont là. Encore un peu de calibrage et les commerciaux t\'adoreront.',en:'The basics are there. A bit more calibration and sales will love you.'}],
  [{fr:'ANALYSTE COSTING CONFIRMÉ',en:'SEASONED COSTING ANALYST'},{fr:'Provisions solides, offres signées : l\'équipe te confie les gros dossiers.',en:'Solid provisions, signed deals: the team trusts you with key accounts.'}],
  [{fr:'MAÎTRE DU MARK-UP',en:'MARK-UP MASTER'},{fr:'Rentable, compétitif et bien calibré. Le backtesting n\'a rien à te reprocher.',en:'Profitable, competitive and well calibrated. Backtesting has nothing on you.'}]];
 const rk=RK[pts>=6?3:pts>=4?2:pts>=2?1:0];$('rank').textContent=t(rk[0]);$('rankTxt').textContent=t(rk[1])+' ('+t(S.yr.n)+' · '+t(S.cp.n)+')';jingle([523,659,784,1047,1319]);
 $('kpis').innerHTML=[[L==='fr'?'P&L annuel':'Annual P&L',keur(S.pl)],[L==='fr'?'Offres signées':'Deals signed',sg.length+'/6'],[L==='fr'?'Bien calibrés':'Well calibrated',cal+'/6'],['Quiz',S.quiz+'/6']].map(k=>'<div>'+k[0]+'<b>'+k[1]+'</b></div>').join('');
 $('tbl').innerHTML='<table class="stk2"><tr><th>'+(L==='fr'?'Dossier':'Deal')+'</th><th>'+(L==='fr'?'Statut':'Status')+'</th><th>'+(L==='fr'?'Marge':'Margin')+'</th></tr>'+H.map(h=>'<tr><td>'+t(h.n)+'</td><td>'+(h.signed?(L==='fr'?'Signé':'Signed'):(L==='fr'?'Perdu (simulé)':'Lost (simulated)'))+'</td><td class="'+(h.m>=0?'ok':'ko')+'">'+keur(h.m)+'</td></tr>').join('')+'</table>';
 $('srcs').innerHTML=(L==='fr'?'Ordres de grandeur réels, modèle de jeu simplifié : ':'Real orders of magnitude, simplified game model: ')+'<a href="https://analysesetdonnees.rte-france.com/" target="_blank" rel="noopener">RTE, Bilan électrique 2025</a> · <a href="https://www.edf.fr/entreprises/electricite-gaz/le-benefice-arenh" target="_blank" rel="noopener">EDF Entreprises, VNU</a> · <a href="https://www.cre.fr/" target="_blank" rel="noopener">CRE</a>';
 chart()};
const svg=$('chart');
const chart=()=>{const H=S?S.hist:[];if(!H.length)return;const W=svg.clientWidth,Hh=svg.clientHeight;if(!W)return;const pad=34,mx=Math.max(6,...H.map(h=>Math.max(h.mk,Math.abs(h.risk))))*1.15;
 const bw=(W-pad-10)/H.length,y0=Hh/2,sc=(Hh/2-24)/mx;let s='<line x1="'+pad+'" x2="'+W+'" y1="'+y0+'" y2="'+y0+'" stroke="#ffffff66"/>';
 [mx*.5,-mx*.5].forEach(v=>{s+='<text x="'+(pad-4)+'" y="'+(y0-v*sc+4)+'" fill="#b9b4d6" font-size="14" text-anchor="end" font-family="VT323">'+Math.round(v)+'</text>'});
 H.forEach((h,i)=>{const x=pad+i*bw+bw*.15,w=bw*.33;const b=(v,xx,c)=>{const hh=Math.abs(v)*sc;s+='<rect x="'+xx+'" y="'+(v>=0?y0-hh:y0)+'" width="'+w+'" height="'+hh+'" fill="'+c+'" opacity="'+(h.signed?1:.5)+'"/>'};
  b(h.mk,x,'#39d0ff');b(h.risk,x+w+2,h.ok?'#7cff6b':'#ff4d6d');s+='<text x="'+(x+w)+'" y="'+(Hh-6)+'" fill="#f4f1ff" font-size="15" text-anchor="middle" font-family="VT323">D'+(i+1)+(h.signed?'':'*')+'</text>'});
 s+='<rect x="'+(pad+6)+'" y="4" width="10" height="10" fill="#39d0ff"/><text x="'+(pad+20)+'" y="13" fill="#f4f1ff" font-size="15" font-family="VT323">'+(L==='fr'?'Mark-up':'Mark-up')+'</text><rect x="'+(pad+90)+'" y="4" width="10" height="10" fill="#7cff6b"/><text x="'+(pad+104)+'" y="13" fill="#f4f1ff" font-size="15" font-family="VT323">'+(L==='fr'?'Risque réalisé':'Realised risk')+'</text>';
 svg.innerHTML=s};
const ro=new ResizeObserver(chart);ro.observe(svg);
window.addEventListener('resize',()=>{WH.forEach(w=>w.size());curve()});

/* ---------- MISC UI ---------- */
$('again').onclick=()=>{show('title');setPal(0)};
$('langBtn').onclick=()=>{L=L==='fr'?'en':'fr';applyLang();beep(700,.06)};
const open=id=>{$(id).classList.add('on');beep(600,.05)};
$('howBtn').onclick=()=>open('mHow');['glossBtn','g2','g3'].forEach(i=>$(i).onclick=()=>open('mGl'));
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>b.closest('.modal').classList.remove('on'));
document.querySelectorAll('.modal').forEach(m=>m.addEventListener('click',e=>{if(e.target===m&&m.id!=='mUp')m.classList.remove('on')}));
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.modal.on').forEach(m=>{if(m.id!=='mUp')m.classList.remove('on')})});
$('gq').oninput=glT;
$('snd').onclick=()=>{SND=!SND;$('snd').textContent=SND?'SON ON':'SON OFF'};
$('start').onmouseenter=()=>beep(1200,.03,'square',.02);
reset();applyLang();
}
</script>
</body>
